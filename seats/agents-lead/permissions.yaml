pi_tools: read, grep, find, ls, bash, write, edit
bash: bd, git, gh, npm, bun, bash, sh, python3, make, curl, jq, grep, sed, awk, cat, ls, mkdir, rm, cp, mv, chmod, tail, head, wc, date, env, which, ps, kill, top, free, df, du, ssh, scp, rsync, systemctl, service, journalctl, ufw, ip, netstat, ss, ping, wget, tar, gzip, unzip, apt, pip, pip3, docker, ollama
