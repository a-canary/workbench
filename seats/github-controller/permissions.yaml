# Seat permissions. Flat `key: a, b, c` lines only; bin/seat reads them without a YAML library.
# tools: Claude Code tool names.  pi_tools: pi tool names.  bash: allowed command prefixes (both harnesses).
tools: Read, Grep, Glob, Bash
pi_tools: read, grep, find, ls, bash
bash: gh pr view, gh pr list, gh pr checks, gh pr diff, gh pr merge, gh pr close, gh pr edit, gh pr comment, git status, git log, git branch, bd show, bd comments
# ponytail: prefix scoping cannot forbid flags; `gh pr merge --admin` and `git log --output` are blocked by the role prompt and host hooks only.
# ponytail: Claude Code merges these settings with the repo's own .claude/settings.json, so a repo can widen them; this file is a default, not a ceiling. The ceiling is the judge gate (repos-oh6y).
